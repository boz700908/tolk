name: Build
on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:
jobs:
  build:
    name: Build ${{ matrix.arch }} ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
            config: Debug
          - arch: x64
            cmake_arch: x64
            config: Release
          - arch: x86
            cmake_arch: Win32
            config: Debug
          - arch: x86
            cmake_arch: Win32
            config: Release
          - arch: arm64
            cmake_arch: ARM64
            config: Debug
          - arch: arm64
            cmake_arch: ARM64
            config: Release
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
      - name: Setup Java Environment
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup .NET SDK (Roslyn C# compiler for modern C# features)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Setup Pandoc
        uses: pandoc/actions/setup@v1
      - name: Configure CMake Project
        run: cmake -B build -A ${{ matrix.cmake_arch }}
      - name: Build Project (${{ matrix.config }})
        run: cmake --build build --config ${{ matrix.config }}
      - name: Stage Build Artifacts
        shell: cmd
        run: |
          mkdir staging
          :: Copy ALL files from CMake-generated dist directory (includes DLLs, LIBs, drivers, wrappers)
          xcopy /E /Y build\dist\${{ matrix.arch }}-${{ matrix.config }}\* staging\
          :: Copy PDB debug symbols for Debug builds
          if "${{ matrix.config }}"=="Debug" copy build\src\${{ matrix.config }}\Tolk.pdb staging\
          :: Copy export file for development linking
          copy build\src\${{ matrix.config }}\Tolk.exp staging\
      - name: Upload Architecture Artifact (${{ matrix.config }})
        uses: actions/upload-artifact@v7
        with:
          name: tolk-${{ matrix.arch }}-${{ matrix.config }}
          path: staging\*
      - name: Upload .NET Library
        if: matrix.arch == 'x64' && matrix.config == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: tolk-dotnet
          path: build\src\dotnet\TolkDotNet.dll
      - name: Upload Java Archive
        if: matrix.arch == 'x64' && matrix.config == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: tolk-java
          path: |
            build\src\java\Tolk.jar
            build\src\java\classes\**
      - name: Upload Documentation
        if: matrix.arch == 'x64' && matrix.config == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: tolk-docs
          path: build\docs\README.html
  package:
    name: Create Release Package
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare Release Package (Debug + Release)
        shell: cmd
        run: |
          mkdir dist\x86\Debug
          mkdir dist\x86\Release
          mkdir dist\x64\Debug
          mkdir dist\x64\Release
          mkdir dist\arm64\Debug
          mkdir dist\arm64\Release
          xcopy /E /Y artifacts\tolk-x86-Debug\* dist\x86\Debug\
          xcopy /E /Y artifacts\tolk-x86-Release\* dist\x86\Release\
          xcopy /E /Y artifacts\tolk-x64-Debug\* dist\x64\Debug\
          xcopy /E /Y artifacts\tolk-x64-Release\* dist\x64\Release\
          xcopy /E /Y artifacts\tolk-arm64-Debug\* dist\arm64\Debug\
          xcopy /E /Y artifacts\tolk-arm64-Release\* dist\arm64\Release\
          :: Language wrappers - shared common directory (avoid duplication across architectures)
          mkdir dist\wrappers\autoit
          mkdir dist\wrappers\purebasic
          mkdir dist\wrappers\python
          xcopy /E /Y dist\x64\Release\autoit\* dist\wrappers\autoit\
          xcopy /E /Y dist\x64\Release\purebasic\* dist\wrappers\purebasic\
          xcopy /E /Y dist\x64\Release\python\* dist\wrappers\python\
          :: Remove duplicate wrapper directories from all architecture folders
          rmdir /s /q dist\x86\Debug\autoit dist\x86\Debug\purebasic dist\x86\Debug\python 2>nul
          rmdir /s /q dist\x86\Release\autoit dist\x86\Release\purebasic dist\x86\Release\python 2>nul
          rmdir /s /q dist\x64\Debug\autoit dist\x64\Debug\purebasic dist\x64\Debug\python 2>nul
          rmdir /s /q dist\x64\Release\autoit dist\x64\Release\purebasic dist\x64\Release\python 2>nul
          rmdir /s /q dist\arm64\Debug\autoit dist\arm64\Debug\purebasic dist\arm64\Debug\python 2>nul
          rmdir /s /q dist\arm64\Release\autoit dist\arm64\Release\purebasic dist\arm64\Release\python 2>nul
          :: .NET Wrapper - separate directory
          mkdir dist\dotnet
          xcopy /E /Y artifacts\tolk-dotnet\* dist\dotnet\
          :: Also copy .NET wrapper to wrappers directory for unified access
          xcopy /E /Y artifacts\tolk-dotnet\* dist\wrappers\dotnet\
          :: Java Wrapper - separate directory
          mkdir dist\java
          xcopy /E /Y artifacts\tolk-java\* dist\java\
          :: Also copy Java wrapper to wrappers directory for unified access
          xcopy /E /Y artifacts\tolk-java\* dist\wrappers\java\
          :: Documentation - separate directory
          mkdir dist\docs
          xcopy /E /Y artifacts\tolk-docs\* dist\docs\
          copy LICENSE* dist\
      - name: Create README for Debug Build
        shell: cmd
        run: |
          echo Debug Build Features: > dist\DEBUG_FEATURES.txt
          echo ===================== >> dist\DEBUG_FEATURES.txt
          echo. >> dist\DEBUG_FEATURES.txt
          echo 1. Tolk_Debug.log written to calling process working directory >> dist\DEBUG_FEATURES.txt
          echo 2. ERR (red) and WRN (yellow) messages printed to console >> dist\DEBUG_FEATURES.txt
          echo 3. All logs sent to Windows OutputDebugString (view with DebugView) >> dist\DEBUG_FEATURES.txt
          echo 4. Full PDB debug symbols included >> dist\DEBUG_FEATURES.txt
          echo 5. Runtime error checking enabled (RTC1 + RTCsu) >> dist\DEBUG_FEATURES.txt
          echo 6. No optimization for easier debugging >> dist\DEBUG_FEATURES.txt
          echo. >> dist\DEBUG_FEATURES.txt
          echo Log file location: Tolk_Debug.log (in your application working directory) >> dist\DEBUG_FEATURES.txt
      - name: Compress Release Package
        shell: cmd
        run: |
          cd dist
          tar -a -c -f tolk.zip *
      - name: Upload Compressed Archive
        uses: actions/upload-artifact@v7
        with:
          name: tolk-dist
          path: dist\tolk.zip
  release:
    name: Create Release
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
      - name: Download Release Package
        uses: actions/download-artifact@v8
        with:
          name: tolk-dist
      - name: Initialize Release Information
        id: release_info
        run: |
          echo "TITLE=Tolk-${{ github.sha }}" >> $env:GITHUB_ENV
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-build
          name: ${{ env.TITLE }}
          body: |
            Commit Hash: ${{ github.sha }}
            Target Branch: ${{ github.ref_name }}

            ## 📦 Build Artifacts Structure Update

            ### 🔧 Major Directory Structure Adjustment
            This build introduces a **major optimization** to the release package structure:

            ### 📁 New Shared `wrappers/` Top-Level Directory
            All language wrappers are now stored in a **single shared directory** (no more duplication across architectures):
            - ✅ **Eliminated 6 duplicate copies** of each wrapper
            - ✅ **Single source of truth** for all language bindings
            - ✅ **Reduced package size** by removing redundant files

            ### 🔗 .NET Wrapper Completion
            - `TolkDotNet.dll` is now included in both:
              - `wrappers/dotnet/` (unified wrappers directory)
              - `dotnet/` (legacy location for backward compatibility)

            ### 📊 Complete Directory Structure
            ```
            dist/
            ├── x86/
            │   ├── Debug/      # 32-bit Debug (Tolk.dll + drivers + PDB symbols)
            │   └── Release/    # 32-bit Release
            ├── x64/
            │   ├── Debug/      # 64-bit Debug
            │   └── Release/    # 64-bit Release
            ├── arm64/
            │   ├── Debug/      # ARM64 Debug (NVDA only)
            │   └── Release/    # ARM64 Release (NVDA only)
            ├── wrappers/       # Shared language wrappers (ALL architectures)
            │   ├── dotnet/     # .NET wrapper (TolkDotNet.dll)
            │   ├── java/       # Java wrapper (Tolk.jar)
            │   ├── python/     # Python wrapper (Tolk.py)
            │   ├── autoit/     # AutoIt wrapper (Tolk.au3)
            │   └── purebasic/  # PureBasic wrapper (Tolk.pb)
            ├── dotnet/         # Legacy .NET (backward compatibility)
            ├── java/           # Legacy Java (backward compatibility)
            ├── docs/           # Documentation
            └── DEBUG_FEATURES.txt
            ```

            ### ✅ Build Artifacts Included
            - x86 Debug (with file logging + console output)
            - x86 Release
            - x64 Debug (with file logging + console output)
            - x64 Release
            - ARM64 Debug (NVDA only)
            - ARM64 Release (NVDA only)
            - Documentation
          files: tolk.zip
          draft: false
          prerelease: false
