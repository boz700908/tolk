name: Build

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }} ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            config: Release
          - arch: x64
            config: Debug
          - arch: x86
            config: Release
          - arch: x86
            config: Debug
          - arch: arm64
            config: Release
          - arch: arm64
            config: Debug
          - arch: arm64ec
            config: Release
          - arch: arm64ec
            config: Debug
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
      - name: Setup Java Environment
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Setup Pandoc
        uses: pandoc/actions/setup@v1
      - name: Build (${{ matrix.arch }} ${{ matrix.config }})
        shell: cmd
        run: build.bat ${{ matrix.config }} --${{ matrix.arch }}
      - name: Upload Architecture Artifact (${{ matrix.arch }} ${{ matrix.config }})
        uses: actions/upload-artifact@v7
        with:
          name: tolk-${{ matrix.arch }}-${{ matrix.config }}
          path: dist/${{ matrix.arch }}/${{ matrix.config }}/*
          if-no-files-found: error
      - name: Upload Language Wrappers
        if: matrix.arch == 'x64' && matrix.config == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: tolk-wrappers
          path: dist/wrappers
          if-no-files-found: error
      - name: Upload Documentation
        if: matrix.arch == 'x64' && matrix.config == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: tolk-docs
          path: dist/docs
          if-no-files-found: error

  wrappers:
    name: Wrapper compile checks
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile and run the wrapper checks (x64 Release)
        shell: cmd
        run: build.bat release --x64 --wrapper-tests

  package:
    name: Create Release Package
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare Release Package (Debug + Release)
        shell: cmd
        run: |
          mkdir dist\x86\Debug
          mkdir dist\x86\Release
          mkdir dist\x64\Debug
          mkdir dist\x64\Release
          mkdir dist\arm64\Debug
          mkdir dist\arm64\Release
          mkdir dist\arm64ec\Debug
          mkdir dist\arm64ec\Release
          xcopy /E /I /Y artifacts\tolk-x86-Debug\* dist\x86\Debug\
          xcopy /E /I /Y artifacts\tolk-x86-Release\* dist\x86\Release\
          xcopy /E /I /Y artifacts\tolk-x64-Debug\* dist\x64\Debug\
          xcopy /E /I /Y artifacts\tolk-x64-Release\* dist\x64\Release\
          xcopy /E /I /Y artifacts\tolk-arm64-Debug\* dist\arm64\Debug\
          xcopy /E /I /Y artifacts\tolk-arm64-Release\* dist\arm64\Release\
          xcopy /E /I /Y artifacts\tolk-arm64ec-Debug\* dist\arm64ec\Debug\
          xcopy /E /I /Y artifacts\tolk-arm64ec-Release\* dist\arm64ec\Release\
          :: Language wrappers — shared common directory (identical for every architecture)
          mkdir dist\wrappers
          xcopy /E /I /Y artifacts\tolk-wrappers\* dist\wrappers\
          :: Native C/C++ import kit — header plus the import library per architecture
          if not exist dist\wrappers\c++\include mkdir dist\wrappers\c++\include
          copy /Y src\Tolk.h dist\wrappers\c++\include\ >nul
          if exist src\TolkVersion.h copy /Y src\TolkVersion.h dist\wrappers\c++\include\ >nul
          for %%A in (x86 x64 arm64 arm64ec) do (
            if exist "artifacts\tolk-%%A-Release\Tolk.lib" (
              if not exist "dist\wrappers\c++\lib\%%A" mkdir "dist\wrappers\c++\lib\%%A"
              copy /Y "artifacts\tolk-%%A-Release\Tolk.lib" "dist\wrappers\c++\lib\%%A\Tolk.lib" >nul
            )
          )
          :: GameMaker shim — compiled once per architecture, shipped prebuilt
          for %%A in (x86 x64 arm64 arm64ec) do (
            if exist "artifacts\tolk-%%A-Release\TolkGml.dll" (
              if not exist "dist\wrappers\game-engines\gamemaker\bin\%%A" mkdir "dist\wrappers\game-engines\gamemaker\bin\%%A"
              copy /Y "artifacts\tolk-%%A-Release\TolkGml.dll" "dist\wrappers\game-engines\gamemaker\bin\%%A\TolkGml.dll" >nul
            )
          )
          :: Documentation — separate directory
          mkdir dist\docs
          xcopy /E /I /Y artifacts\tolk-docs\* dist\docs\
          copy LICENSE* dist\
      - name: Create README for Debug Build
        shell: cmd
        run: |
          echo Debug Build Features: > dist\DEBUG_FEATURES.txt
          echo ===================== >> dist\DEBUG_FEATURES.txt
          echo. >> dist\DEBUG_FEATURES.txt
          echo 1. Tolk_Debug.log written to calling process working directory >> dist\DEBUG_FEATURES.txt
          echo 2. ERR (red) and WRN (yellow) messages printed to console >> dist\DEBUG_FEATURES.txt
          echo 3. All logs sent to Windows OutputDebugString (view with DebugView) >> dist\DEBUG_FEATURES.txt
          echo 4. Full PDB debug symbols included >> dist\DEBUG_FEATURES.txt
          echo 5. Runtime error checking enabled (RTC1 + RTCsu) >> dist\DEBUG_FEATURES.txt
          echo 6. No optimization for easier debugging >> dist\DEBUG_FEATURES.txt
          echo. >> dist\DEBUG_FEATURES.txt
          echo Log file location: Tolk_Debug.log (in your application working directory) >> dist\DEBUG_FEATURES.txt
      - name: Compress Release Package
        shell: cmd
        run: |
          cd dist
          tar -a -c -f tolk.zip *
      - name: Upload Compressed Archive
        uses: actions/upload-artifact@v7
        with:
          name: tolk-dist
          path: dist\tolk.zip

  release:
    name: Create Release
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
      - name: Download Release Package
        uses: actions/download-artifact@v8
        with:
          name: tolk-dist
      - name: Initialize Release Information
        id: release_info
        run: |
          echo "TITLE=Tolk-${{ github.sha }}" >> $env:GITHUB_ENV
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-build
          name: ${{ env.TITLE }}
          body: |
            Commit Hash: ${{ github.sha }}
            Target Branch: ${{ github.ref_name }}
          files: tolk.zip
          draft: false
          prerelease: false
