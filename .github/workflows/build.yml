name: Build
on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:
jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86, x64, arm64]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
      - name: Setup Java Environment
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Setup Pandoc
        uses: pandoc/actions/setup@v1
      - name: Build with build.bat
        shell: cmd
        run: build.bat --${{ matrix.arch }} --clean
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tolk-${{ matrix.arch }}
          path: dist\**
      - name: Upload .NET Library
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: tolk-dotnet
          path: dist\TolkDotNet.dll
      - name: Upload Java Archive
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: tolk-java
          path: dist\Tolk.jar
      - name: Upload Documentation
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: tolk-docs
          path: dist\README.html
  package:
    name: Create Release Package
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Assemble Release Package
        shell: cmd
        run: |
          mkdir dist
          :: Merge per-architecture dist directories
          xcopy /E /Y artifacts\tolk-x86\* dist\
          xcopy /E /Y artifacts\tolk-x64\* dist\
          xcopy /E /Y artifacts\tolk-arm64\* dist\
          :: .NET, Java, Docs — pick from x64 (architecture-independent)
          xcopy /E /Y artifacts\tolk-dotnet\* dist\wrappers\dotnet\
          xcopy /E /Y artifacts\tolk-java\* dist\wrappers\java\
          mkdir dist\docs
          xcopy /E /Y artifacts\tolk-docs\* dist\docs\
          :: Source wrappers — deduplicate from arch dirs into unified wrappers/
          mkdir dist\wrappers\autoit
          mkdir dist\wrappers\purebasic
          mkdir dist\wrappers\python
          if exist dist\x64\Release\autoit\* xcopy /E /Y dist\x64\Release\autoit\* dist\wrappers\autoit\
          if exist dist\x64\Release\purebasic\* xcopy /E /Y dist\x64\Release\purebasic\* dist\wrappers\purebasic\
          if exist dist\x64\Release\python\* xcopy /E /Y dist\x64\Release\python\* dist\wrappers\python\
          :: Remove duplicate wrapper directories from all architecture folders
          for %%A in (x86 x64 arm64) do (
            for %%C in (Debug Release) do (
              rmdir /s /q dist\%%A\%%C\autoit 2>nul
              rmdir /s /q dist\%%A\%%C\purebasic 2>nul
              rmdir /s /q dist\%%A\%%C\python 2>nul
            )
          )
          :: License files
          copy LICENSE* dist\
      - name: Create README for Debug Build
        shell: cmd
        run: |
          echo Debug Build Features: > dist\DEBUG_FEATURES.txt
          echo ===================== >> dist\DEBUG_FEATURES.txt
          echo. >> dist\DEBUG_FEATURES.txt
          echo 1. Tolk_Debug.log written to calling process working directory >> dist\DEBUG_FEATURES.txt
          echo 2. ERR (red) and WRN (yellow) messages printed to console >> dist\DEBUG_FEATURES.txt
          echo 3. All logs sent to Windows OutputDebugString (view with DebugView) >> dist\DEBUG_FEATURES.txt
          echo 4. Full PDB debug symbols included >> dist\DEBUG_FEATURES.txt
          echo 5. Runtime error checking enabled (RTC1 + RTCsu) >> dist\DEBUG_FEATURES.txt
          echo 6. No optimization for easier debugging >> dist\DEBUG_FEATURES.txt
          echo. >> dist\DEBUG_FEATURES.txt
          echo Log file location: Tolk_Debug.log (in your application working directory) >> dist\DEBUG_FEATURES.txt
      - name: Compress Release Package
        shell: cmd
        run: |
          cd dist
          tar -a -c -f tolk.zip *
      - name: Upload Compressed Archive
        uses: actions/upload-artifact@v7
        with:
          name: tolk-dist
          path: dist\tolk.zip
  release:
    name: Create Release
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
      - name: Download Release Package
        uses: actions/download-artifact@v8
        with:
          name: tolk-dist
      - name: Initialize Release Information
        id: release_info
        run: |
          echo "TITLE=Tolk-${{ github.sha }}" >> $env:GITHUB_ENV
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-build
          name: ${{ env.TITLE }}
          body: |
            Commit Hash: ${{ github.sha }}
            Target Branch: ${{ github.ref_name }}
          files: tolk.zip
          draft: false
          prerelease: false