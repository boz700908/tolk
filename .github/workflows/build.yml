name: Build
on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:
jobs:
  build:
    name: Build ${{ matrix.arch }} ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            cmake_arch: x64
            config: Debug
          - arch: x64
            cmake_arch: x64
            config: Release
          - arch: x86
            cmake_arch: Win32
            config: Debug
          - arch: x86
            cmake_arch: Win32
            config: Release
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
      - name: Setup Java Environment
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Pandoc
        uses: pandoc/actions/setup@v1
      - name: Configure CMake Project
        run: cmake -B build -A ${{ matrix.cmake_arch }}
      - name: Build Project (${{ matrix.config }})
        run: cmake --build build --config ${{ matrix.config }}
      - name: Stage Build Artifacts
        shell: cmd
        run: |
          mkdir staging
          copy build\src\${{ matrix.config }}\* staging\
          copy libs\${{ matrix.arch }}\* staging\
      - name: Upload Architecture Artifact (${{ matrix.config }})
        uses: actions/upload-artifact@v7
        with:
          name: tolk-${{ matrix.arch }}-${{ matrix.config }}
          path: staging\*
      - name: Upload .NET Library
        if: matrix.arch == 'x64' && matrix.config == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: tolk-dotnet
          path: build\src\dotnet\*
      - name: Upload Java Archive
        if: matrix.arch == 'x64' && matrix.config == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: tolk-java
          path: build\src\java\*
      - name: Upload Documentation
        if: matrix.arch == 'x64' && matrix.config == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: tolk-docs
          path: build\docs\*
  package:
    name: Create Release Package
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare Release Package (Debug + Release)
        shell: cmd
        run: |
          mkdir dist\x86\Debug
          mkdir dist\x86\Release
          mkdir dist\x64\Debug
          mkdir dist\x64\Release
          xcopy /E /Y artifacts\tolk-x86-Debug\* dist\x86\Debug\
          xcopy /E /Y artifacts\tolk-x86-Release\* dist\x86\Release\
          xcopy /E /Y artifacts\tolk-x64-Debug\* dist\x64\Debug\
          xcopy /E /Y artifacts\tolk-x64-Release\* dist\x64\Release\
          xcopy /E /Y artifacts\tolk-dotnet\* dist\
          xcopy /E /Y artifacts\tolk-java\* dist\
          xcopy /E /Y artifacts\tolk-docs\* dist\
          copy LICENSE* dist\
      - name: Create README for Debug Build
        shell: cmd
        run: |
          echo Debug Build Features: > dist\DEBUG_FEATURES.txt
          echo ===================== >> dist\DEBUG_FEATURES.txt
          echo. >> dist\DEBUG_FEATURES.txt
          echo 1. Tolk_Debug.log written to calling process working directory >> dist\DEBUG_FEATURES.txt
          echo 2. ERR (red) and WRN (yellow) messages printed to console >> dist\DEBUG_FEATURES.txt
          echo 3. All logs sent to Windows OutputDebugString (view with DebugView) >> dist\DEBUG_FEATURES.txt
          echo 4. Full PDB debug symbols included >> dist\DEBUG_FEATURES.txt
          echo 5. Runtime error checking enabled (RTC1 + RTCsu) >> dist\DEBUG_FEATURES.txt
          echo 6. No optimization for easier debugging >> dist\DEBUG_FEATURES.txt
          echo. >> dist\DEBUG_FEATURES.txt
          echo Log file location: Tolk_Debug.log (in your application working directory) >> dist\DEBUG_FEATURES.txt
      - name: Compress Release Package
        shell: cmd
        run: |
          cd dist
          tar -a -c -f tolk.zip *
      - name: Upload Compressed Archive
        uses: actions/upload-artifact@v7
        with:
          name: tolk-dist
          path: dist\tolk.zip
  release:
    name: Create Release
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6
      - name: Download Release Package
        uses: actions/download-artifact@v8
        with:
          name: tolk-dist
      - name: Initialize Release Information
        id: release_info
        run: |
          echo "TITLE=Tolk-${{ github.sha }}" >> $env:GITHUB_ENV
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-build
          name: ${{ env.TITLE }}
          body: |
            Commit Hash: ${{ github.sha }}
            Target Branch: ${{ github.ref_name }}

            **Build Artifacts Included:**
            - x86 Debug (with file logging + console output)
            - x86 Release
            - x64 Debug (with file logging + console output)
            - x64 Release
            - .NET Wrapper
            - Java JAR
            - Documentation
          files: tolk.zip
          draft: false
          prerelease: false
