---
version: 1.0.{build}

# 使用Visual Studio 2022镜像（适配CMake + MSVC构建）
image: Visual Studio 2022

# 安装依赖：Pandoc（用于文档构建）
install:
  - choco install pandoc -y
  - refreshenv  # 刷新环境变量，确保Pandoc路径生效

# 构建脚本：直接调用项目自带的build.bat
build_script:
  - cmd: build.bat

# 构建产物归档
artifacts:
  - path: dist
    name: Tolk-Build-Output

# 关闭自动测试
test: false

# 缓存构建目录加速后续构建
cache:
  - build-x86
  - build-x64
