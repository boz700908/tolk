---
version: 1.0.{build}
image: Visual Studio 2022

# AppVeyor VS 2022 image has: CMake, MSBuild, Chocolatey
# Missing tools (Pandoc, .NET SDK, Java, Ninja) are installed by build.bat
# --clean ensures no stale CMake cache from previous builds

build_script:
  - cmd: build.bat --clean

# Build artifacts
artifacts:
  - path: dist
    name: Tolk-Build-Output

# No test suite yet
test: false

# Cache NuGet packages only (not build dirs — clean build each time)
cache:
  - '%USERPROFILE%\.nuget\packages'
