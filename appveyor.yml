---
version: 1.0.{build}
image: Visual Studio 2022

# AppVeyor VS 2022 image already has:
#   CMake, MSBuild, .NET SDK, Java, Pandoc, Ninja
# build.bat detects CI and skips tool installation checks.

build_script:
  - cmd: build.bat

# Build artifacts
artifacts:
  - path: dist
    name: Tolk-Build-Output

# No test suite yet
test: false

# Cache build directories for faster incremental builds
cache:
  - build-x86
  - build-x64
  - build-arm64
  - '%USERPROFILE%\.nuget\packages'
